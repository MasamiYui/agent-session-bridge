name: Feature request
description: Suggest a change to browsing, organizing, or copying sessions
title: "feat: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Codex
        - Claude Code
        - Antigravity
        - Project sync
        - Import or export
        - Desktop interface
        - Packaging
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should Bridge behave? Note if it would write anything outside Bridge's own data.
    validations:
      required: true
