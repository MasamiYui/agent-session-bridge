name: Check and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets -- -D warnings
      - run: npm run test:core
      - run: npx playwright install --with-deps chromium
      - run: npm run test:gui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gui-test-results
          path: test-results
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.0
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run bundle
      - name: Archive macOS app bundle
        if: runner.os == 'macOS'
        run: tar -C src-tauri/target/release/bundle/macos -czf "src-tauri/target/release/bundle/macos/Agent Session Bridge.app.tar.gz" "Agent Session Bridge.app"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-session-bridge-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, package]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-session-bridge-*
          merge-multiple: false
          path: dist
      - name: Collect installers
        run: |
          mkdir -p release
          find dist -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.msi' -o -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} release/ \;
          find release -type f -print
          test -n "$(find release -type f -print -quit)"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          notes=$(cat <<EOF
Installers for ${tag}.

- macOS: .dmg and .app.tar.gz (unsigned, not notarized; open from Finder if macOS asks)
- Windows: NSIS .exe and .msi
- Linux: .deb and .AppImage

Built from the tagged commit by CI. See the README for data directories and the supported CLI versions.
EOF
)
          gh release create "$tag" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes "$notes" \
            --verify-tag
